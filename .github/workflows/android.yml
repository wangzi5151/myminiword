name: Android CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMGR="$(command -v sdkmanager || true)"
          if [ -z "$SDKMGR" ]; then
            SDKMGR="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | head -n1)"
          fi
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-34" "build-tools;34.0.0" >/dev/null
          AAPT2="$(ls "$SDK"/build-tools/34.0.0/aapt2)"
          test -x "$AAPT2"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "AAPT2=$AAPT2" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v3

      - name: Unit tests
        run: bash gradlew testDebugUnitTest --stacktrace -Pandroid.aapt2FromMavenOverride="$AAPT2"

      - name: Build debug APK
        run: bash gradlew assembleDebug --stacktrace -Pandroid.aapt2FromMavenOverride="$AAPT2"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: voxelcraft-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
